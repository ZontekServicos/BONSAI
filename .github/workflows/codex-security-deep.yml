name: Codex Security Deep

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-security-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep:
    name: Deep repository scan
    # Use the same reviewed Environment as PR scans; never a repository secret.
    environment: codex-security
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Deep scan
        id: scan
        uses: openai/codex-security@a98b35d7eef9f85c298c86229445bb64ac427aaf # action-v0.9.1
        with:
          scope: repository
          mode: deep
          max-time-hours: "1"
          model: gpt-5.6-sol
          cyber-access-program: standard
          effort: xhigh
          max-cost: ${{ vars.CODEX_SECURITY_DEEP_MAX_COST || '20' }}
          fail-on-severity: high
          verbose: false
          summary: true
          upload-artifacts: false
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
      - name: Require completed analysis
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.scan-status }}
          POLICY_STATUS: ${{ steps.scan.outputs.policy-status }}
          REPORT_STATUS: ${{ steps.scan.outputs.report-status }}
          SCANNED_SHA: ${{ steps.scan.outputs.scanned-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$SCAN_STATUS" = completed
          test "$POLICY_STATUS" = passed
          test "$REPORT_STATUS" = ready
          test "$SCANNED_SHA" = "$EXPECTED_SHA"
